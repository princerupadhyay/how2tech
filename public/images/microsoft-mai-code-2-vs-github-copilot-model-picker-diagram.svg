<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">GitHub Copilot is the tool; MAI Code 2 is one model in its model picker</title>
  <desc id="d">Diagram: GitHub Copilot, the tool, contains a model picker. The picker lists MAI Code 2, MAI Code 2 Flash and other models such as GPT and Claude models.</desc>
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="380" rx="16" fill="#f6f7f9" stroke="#d5d8de" stroke-width="2"/>
  <text x="50" y="62" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111318">GitHub Copilot (the tool)</text>
  <text x="50" y="88" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444a55">Where you work: editor, CLI, github.com, mobile</text>
  <rect x="50" y="130" width="230" height="200" rx="12" fill="#111318"/>
  <text x="165" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Model picker</text>
  <text x="165" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d5d8de">you choose one</text>
  <path d="M290 230 H350" stroke="#F10F16" stroke-width="4" fill="none"/>
  <path d="M342 218 L358 230 L342 242 Z" fill="#F10F16"/>
  <rect x="370" y="120" width="560" height="52" rx="10" fill="#ffffff" stroke="#F10F16" stroke-width="3"/>
  <text x="392" y="154" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111318">MAI Code 2</text>
  <text x="560" y="154" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444a55">harder jobs: debugging, multi-file changes</text>
  <rect x="370" y="184" width="560" height="52" rx="10" fill="#ffffff" stroke="#F10F16" stroke-width="3"/>
  <text x="392" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111318">MAI Code 2 Flash</text>
  <text x="600" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444a55">quick edits, explanations, routine fixes</text>
  <rect x="370" y="248" width="560" height="52" rx="10" fill="#ffffff" stroke="#b6bbc5" stroke-width="2"/>
  <text x="392" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111318">GPT models</text>
  <text x="560" y="282" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444a55">other models already in the picker</text>
  <rect x="370" y="312" width="560" height="52" rx="10" fill="#ffffff" stroke="#b6bbc5" stroke-width="2"/>
  <text x="392" y="346" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111318">Claude models</text>
  <text x="560" y="346" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444a55">other models already in the picker</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
