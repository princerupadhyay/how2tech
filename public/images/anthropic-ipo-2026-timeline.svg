<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Anthropic IPO timeline</title>
<desc id="d">26 Oct public S-1 filed, 10 Nov roadshow and $70 to $78 range, 18 Nov priced at $83, 19 Nov trading starts on Nasdaq as ANT.</desc>
<rect width="900" height="260" fill="#ffffff"/>
<line x1="90" y1="110" x2="810" y2="110" stroke="#111318" stroke-width="4"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<circle cx="90" cy="110" r="14" fill="#111318"/>
<text x="90" y="75" font-size="22" font-weight="700" fill="#111318">26 Oct</text>
<text x="90" y="150" font-size="16" fill="#111318">Public S-1</text>
<text x="90" y="172" font-size="16" fill="#111318">filed</text>
<circle cx="350" cy="110" r="14" fill="#111318"/>
<text x="350" y="75" font-size="22" font-weight="700" fill="#111318">10 Nov</text>
<text x="350" y="150" font-size="16" fill="#111318">Roadshow starts</text>
<text x="350" y="172" font-size="16" fill="#111318">Range $70 to $78</text>
<circle cx="580" cy="110" r="14" fill="#111318"/>
<text x="580" y="75" font-size="22" font-weight="700" fill="#111318">18 Nov</text>
<text x="580" y="150" font-size="16" fill="#111318">Priced at $83</text>
<text x="580" y="172" font-size="16" fill="#111318">(above range)</text>
<circle cx="810" cy="110" r="16" fill="#F10F16"/>
<text x="810" y="75" font-size="22" font-weight="700" fill="#F10F16">19 Nov</text>
<text x="810" y="150" font-size="16" fill="#111318">Trading starts</text>
<text x="810" y="172" font-size="16" fill="#111318">Nasdaq: ANT</text>
<text x="450" y="235" font-size="13" fill="#555555">How2Tech.in</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
