<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Instagram account deletion timeline</title>
  <desc id="d">Day 0 you confirm deletion and the profile is hidden. Up to day 30 you can cancel by logging in. At day 30 the account is permanently deleted. The process can take up to day 90, and backup copies may remain after that.</desc>
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111318">What happens after you press Delete</text>
  <line x1="70" y1="150" x2="730" y2="150" stroke="#111318" stroke-width="4"/>
  <rect x="70" y="138" width="270" height="24" fill="#F10F16" opacity="0.18"/>
  <rect x="340" y="138" width="270" height="24" fill="#111318" opacity="0.10"/>
  <circle cx="70" cy="150" r="11" fill="#F10F16"/>
  <circle cx="340" cy="150" r="11" fill="#F10F16"/>
  <circle cx="610" cy="150" r="11" fill="#111318"/>
  <circle cx="730" cy="150" r="11" fill="#6b7280"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111318" text-anchor="middle">
    <text x="70" y="115" font-size="16" font-weight="700">Day 0</text>
    <text x="340" y="115" font-size="16" font-weight="700">Day 30</text>
    <text x="610" y="115" font-size="16" font-weight="700">Up to day 90</text>
    <text x="730" y="115" font-size="16" font-weight="700">After that</text>
    <text x="70" y="195" font-size="14">You confirm</text>
    <text x="70" y="215" font-size="14">Profile hidden</text>
    <text x="205" y="262" font-size="14" font-weight="700" fill="#F10F16">Waiting room: logging in cancels it</text>
    <text x="340" y="195" font-size="14">Account and data</text>
    <text x="340" y="215" font-size="14">permanently deleted</text>
    <text x="475" y="262" font-size="14" font-weight="700">Clean up continues</text>
    <text x="610" y="195" font-size="14">Process can</text>
    <text x="610" y="215" font-size="14">take this long</text>
    <text x="730" y="195" font-size="14">Backup copies</text>
    <text x="730" y="215" font-size="14">may remain</text>
    <text x="400" y="312" font-size="13" fill="#4b5563">Day 30 can differ by region. Source: Instagram Help Center.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
